name: Mobile Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "lib/**"
      - "store/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "type.d.ts"
      - "app.json"
      - "eslint.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - ".env.example"
      - ".github/workflows/mobile-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "lib/**"
      - "store/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "type.d.ts"
      - "app.json"
      - "eslint.config.js"
      - "babel.config.js"
      - "metro.config.js"
      - ".env.example"
      - ".github/workflows/mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and lint mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); console.log("Full dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2))'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = require("./npm-audit-production.json"); console.log("Production dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2))'
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
