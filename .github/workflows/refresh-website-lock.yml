name: Temporary website lockfile refresh

on:
  push:
    branches: [fix/foodiefly-role-security]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Resolve patched website dependency tree
        working-directory: website
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit fix --package-lock-only --no-fund || true
      - name: Commit refreshed website lockfile
        run: |
          if git diff --quiet -- website/package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json
          git commit -m "security: refresh website dependency lockfile"
          git push
